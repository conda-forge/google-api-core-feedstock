schema_version: 1

context:
  name: google-api-core
  version: "2.39.0"

recipe:
  name: ${{ name|lower }}-split
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name|replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 824ee414a10adefefae33fc5e2ba28dc6f0f7089d011c9cc98ea9178e61299e9

build:
  number: 0

outputs:
  - package:
      name: ${{ name }}
    build:
      noarch: python
      script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python ${{ python_min }}.*
        - pip
        - setuptools
      run:
        - python >=${{ python_min }}
        - googleapis-common-protos >=1.69.2,<2.0.0
        - protobuf >=6.33.5,<8.0.0
        - proto-plus >=1.26.1,<2.0.0
        - google-auth >=2.14.1,<3.0.0
        - requests >=2.33.0,<3.0.0
        - opentelemetry-api >=1.44.0,<2.0.0

    tests:
      - python:
          imports:
            - google.auth
            - google.auth.credentials
            - google.auth.transport.requests
            - google.longrunning
            - google.longrunning.operations_pb2
            - google.protobuf
            - google.rpc
            - google.api_core
            - google.api_core.exceptions
            - google.api_core.future
            - google.api_core.future.base
            - google.api_core.future.polling
            - google.api_core.general_helpers
            - google.api_core.page_iterator
            - google.api_core.protobuf_helpers
            - google.api_core.retry
            - google.api_core.timeout
          python_version:
            - ${{ python_min }}.*
            - "*"
          pip_check: true

  - package:
      name: ${{ name }}-grpc
    build:
      # noarch: python rather than noarch: generic because different python constraints
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage(name, exact=true) }}
        # tightest of upstream's floors (python >=3.14)
        - grpcio >=1.75.1,<2.0.0
        # tightest of upstream's floors (python >=3.14)
        - grpcio-status >=1.75.1,<2.0.0
    tests:
      - python:
          imports:
            - google.api_core
          python_version:
            - ${{ python_min }}.*
            - "*"
          pip_check: true

about:
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-api-core
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Google API client core library
  description: |
    Google API client core library
    -------------------------

    This library is not meant to stand-alone. Instead it defines
    common helpers used by all Google API clients. For more information, see the
    [documentation](https://googleapis.dev/python/google-api-core/latest).

  documentation: https://googleapis.dev/python/google-api-core/latest/index.html
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-api-core

extra:
  feedstock-name: google-api-core
  recipe-maintainers:
    - xylar
    - BrentDorsey
    - parthea
    - tswast
